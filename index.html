<html lang="ja">

  <meta charset="UTF-8">

  <title>『約三十の嘘』時間移動</title>

  <style>

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      max-width: 720px;

      margin: 60px auto;

      padding: 0 24px;

      line-height: 1.8;

      color: #222;
    }


    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }


    .description {
      margin-bottom: 20px;
    }


    .bookmarklet {
      display: inline-block;

      margin: 25px 0;

      padding: 16px 28px;

      background: #333;

      color: white;

      text-decoration: none;

      border-radius: 10px;

      font-size: 18px;

      font-weight: bold;

      cursor: grab;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.2);
    }


    .bookmarklet:hover {
      background: #555;
    }


    .box {
      margin-top: 30px;

      padding: 22px;

      background: #f5f5f5;

      border-radius: 10px;
    }


    .important {
      font-weight: bold;
    }


    .arrow {
      font-size: 24px;
    }

  </style>

</head>


<body>


  <h1>『約三十の嘘』時間移動</h1>


  <p class="description">
    観劇三昧の『約三十の嘘』で、
    場面や役者ごとの指定時間へ
    すぐに移動するためのブックマークです。
  </p>


  <p>
    下のボタンを
    <strong>ブックマークバーへドラッグしてください。</strong>
  </p>


  <p class="arrow">
    ↓
  </p>


  <a
    id="bookmarklet"
    class="bookmarklet"
    href="#"
  >
    『約三十の嘘』時間移動
  </a>


  <div class="box">

    <h2>使い方</h2>

    <p>
      ① 観劇三昧で『約三十の嘘』を開く
      <br>

      ② 動画を一度再生できる状態にする
      <br>

      ③ ブックマークバーの
      <strong>「『約三十の嘘』時間移動」</strong>
      をクリック
      <br>

      ④ 画面右側に時間移動メニューが表示される
      <br>

      ⑤ 「第一場〜第五場」または
      「役者・ページ」をクリック
    </p>

    <p class="important">
      ※このブックマークの登録は最初の1回だけです。
    </p>

  </div>
